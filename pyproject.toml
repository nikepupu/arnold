[project]
name = "arnold"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "wandb>=0.24.2",
]

[dependency-groups]
dev = [
    "ipdb>=0.13",
    "ipython>=8.0",
]

[build-system]
requires = ["setuptools", "cython", "numpy"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["renewed_tasks*", "renewed_utils*", "environment*", "local_utils*"]
